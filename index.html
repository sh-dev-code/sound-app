<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#12161f">
  <title>音で集中＆寝かしつけ</title>
  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <main>
    <nav class="segmented mode-switch" aria-label="モード">
      <button type="button" data-mode="baby">赤ちゃん</button>
      <button type="button" data-mode="focus">集中</button>
    </nav>

    <p id="notice" class="notice">音量は小さめに、スマホは赤ちゃんの耳元から離して置いてください。</p>

    <section>
      <h2>音</h2>
      <div id="sounds" class="chips"></div>
    </section>

    <section>
      <h2>タイマー</h2>
      <div id="baby-timer" class="segmented"></div>
      <div id="focus-timer" class="timer-row">
        <label>集中 <select id="focus-min"></select></label>
        <label>休憩 <select id="break-min"></select></label>
      </div>
    </section>

    <div class="player">
      <p id="phase" class="phase"></p>
      <p id="time" class="time"></p>
      <button type="button" id="play" disabled>再生</button>
      <p id="now-playing" class="now-playing" aria-live="polite"></p>
    </div>

    <section>
      <h2>音量</h2>
      <div class="volume-row">
        <input type="range" id="volume" min="0" max="100" value="50" aria-label="音量">
        <span id="volume-value"></span>
      </div>
      <p id="volume-note" class="note">赤ちゃんモードは、音量を一番大きくしても控えめな大きさまでに抑えています。</p>
    </section>

    <details>
      <summary>動作ログ（開発用）</summary>
      <ol id="log"></ol>
    </details>
  </main>

  <dialog id="baby-dialog">
    <h2>赤ちゃんモードを使う前に</h2>
    <p>音量は小さめにして、スマホは赤ちゃんの耳元から離して置いてください。</p>
    <p>このアプリは、赤ちゃんやあなたに合う音を探すためのものです。効果には個人差があります。</p>
    <button type="button" id="baby-dialog-ok">分かりました</button>
  </dialog>
</body>
</html>
